name: CD dev (preview + storybook)

on:
  push:
    branches: [ dev ]

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-dev
  cancel-in-progress: true

env:
  NODE_VERSION: 20
  FIREBASE_PROJECT_ID: intranetdr-50f9e

jobs:
  deploy-preview-and-storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install Firebase CLI
        run: npm i -g firebase-tools

      - name: Patch NEXT_PUBLIC_MODE in .env
        run: |
          if grep -q '^NEXT_PUBLIC_MODE=' .env; then
            sed -i 's/^NEXT_PUBLIC_MODE=.*/NEXT_PUBLIC_MODE=2/' .env
          else
            echo 'NEXT_PUBLIC_MODE=2' >> .env
          fi
          echo "NEXT_PUBLIC_MODE actual:"
          grep -E '^NEXT_PUBLIC_MODE=' .env

      - name: Sanity check env (pre-build)
        run: |
          set -e
          # exporta variables del .env al entorno del shell
          set -a; source .env; set +a
          # imprime el modo y la URL que usará tu app según el modo
          node -e "const m=process.env.NEXT_PUBLIC_MODE; const base = m==='1'?process.env.NEXT_PUBLIC_INTRANET_ENDPOINT_PROD : m==='2'?process.env.NEXT_PUBLIC_INTRANET_ENDPOINT_STAGING : process.env.NEXT_PUBLIC_INTRANET_ENDPOINT_LOCAL; console.log('NEXT_PUBLIC_MODE=', m, '→ baseURL:', base);"

      # 🏗️ Build + (export si sirves estático desde "out")
      - name: Build Next (and export)
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          set -e
          npm run build
      # 🚀 Preview channel de la app (canal "dev")
      # Usamos el siteId como argumento posicional (tu CLI no acepta --site)
      - name: Deploy app dev page
        run: |
          firebase hosting:channel:deploy dev --only intranetdr

     
