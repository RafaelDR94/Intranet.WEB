name: CD dev (preview + storybook)

on:
  push:
    branches: [ dev ]

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-dev
  cancel-in-progress: true

env:
  NODE_VERSION: 20
  FIREBASE_PROJECT_ID: intranetdr-50f9e

jobs:
  deploy-preview-and-storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install Firebase CLI
        run: npm i -g firebase-tools@latest

      # --- Diagnóstico útil ---
      - name: Versions & config
        run: |
          set -x
          node -v
          npm -v
          firebase --version
          cat .firebaserc || true
          cat firebase.json || true

      # --- Build + Export (crea /out para Hosting estático) ---
      - name: Build Next and export
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          set -e
          npm run build

      # Verifica que /out exista (si no, falla con mensaje claro)
      - name: Verify out directory
        run: |
          set -e
          test -d out || { echo "ERROR: 'out/' no existe. Asegúrate de ejecutar 'next export' y que no haya fallado el build."; exit 1; }
          ls -la out | head -n 50

      # --- Deploy Preview (channel 'dev') ---
      - name: Deploy app preview (channel dev)
        run: |
          set -e
          firebase hosting:channel:deploy dev --only intranetdr-50f9e

      # --- Storybook ---
      - name: Build Storybook
        run: npm run build-storybook

      - name: Verify storybook-static directory
        run: |
          set -e
          test -d storybook-static || { echo "ERROR: 'storybook-static/' no existe. Revisa 'npm run build-storybook'."; exit 1; }
          ls -la storybook-static | head -n 50

      - name: Deploy Storybook
        run: |
          set -e
          firebase deploy --only hosting:drintranettecnicdocumentation

     
