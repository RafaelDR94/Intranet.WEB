name: CD dev (preview + storybook)

on:
  push:
    branches: [ dev ]

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-dev
  cancel-in-progress: true

env:
  NODE_VERSION: 20
  FIREBASE_PROJECT_ID: intranetdr-50f9e

jobs:
  deploy-preview-and-storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install Firebase CLI
        run: npm i -g firebase-tools

      - name: Set NEXT_PUBLIC_MODE por rama
        run: |
          MODE=2 
          echo "NEXT_PUBLIC_MODE=$MODE" >> $GITHUB_ENV


      # 🏗️ Build + (export si sirves estático desde "out")
      - name: Build Next (and export)
        env:
          NEXT_PUBLIC_MODE: ${{ env.NEXT_PUBLIC_MODE }}
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          set -e
          npm run build
      # 🚀 Preview channel de la app (canal "dev")
      # Usamos el siteId como argumento posicional (tu CLI no acepta --site)
      - name: Deploy app stagging page
        run: |
          firebase deploy --only hosting:intranetdr

     