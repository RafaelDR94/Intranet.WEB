name: CD staging (deploy)

on:
  push:
    branches: [ staging ]

permissions:
  contents: read
  id-token: write   # auth con GCP

concurrency:
  group: cd-staging
  cancel-in-progress: true

env:
  NODE_VERSION: 20
  FIREBASE_PROJECT_ID: intranetdr-50f9e

jobs:
  deploy-preview-and-storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install deps
        run: npm ci

      # 🔐 Autenticación GCP (usa tu secret GCP_SA_KEY con la key JSON del Service Account)
      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install Firebase CLI
        run: npm i -g firebase-tools

      - name: Patch NEXT_PUBLIC_MODE in .env
        run: |
          if grep -q '^NEXT_PUBLIC_MODE=' .env; then
            sed -i 's/^NEXT_PUBLIC_MODE=.*/NEXT_PUBLIC_MODE=2/' .env
          else
            echo 'NEXT_PUBLIC_MODE=2' >> .env
          fi
          echo "NEXT_PUBLIC_MODE actual:"
          grep -E '^NEXT_PUBLIC_MODE=' .env
      - name: Sanity check env (pre-build)
        run: |
          set -e
          # exporta variables del .env al entorno del shell
          set -a; source .env; set +a
          # imprime el modo y la URL que usará tu app según el modo
          node -e "const m=process.env.NEXT_PUBLIC_MODE; const base = m==='1'?process.env.NEXT_PUBLIC_INTRANET_ENDPOINT_PROD : m==='2'?process.env.NEXT_PUBLIC_INTRANET_ENDPOINT_STAGING : process.env.NEXT_PUBLIC_INTRANET_ENDPOINT_LOCAL; console.log('NEXT_PUBLIC_MODE=', m, '→ baseURL:', base);"

      # 🏗️ Build + (export si sirves estático desde "out")
      - name: Build Next (and export)
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm run build
      # 🚀 Preview channel de la app (canal "dev")
      # Usamos el siteId como argumento posicional (tu CLI no acepta --site)
      - name: Deploy app stagging page
        run: |
          firebase deploy --only hosting:stagginsite
      # 📖 Storybook
      - name: Build Storybook
        run: npm run build-storybook

      - name: Verify storybook-static
        run: |
          set -e
          test -d storybook-static || { echo "ERROR: 'storybook-static/' no existe. Revisa 'npm run build-storybook'."; exit 1; }
          ls -la storybook-static | head -n 50
      - name: Deploy Storybook
        run: |
          set -e
          firebase deploy --only hosting:drintranettecnicdocumentation 

